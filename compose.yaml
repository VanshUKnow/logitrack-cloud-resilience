services:
  logitrack-api:
    build: .
    container_name: logitrack-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/logitrack.db
    volumes:
      - logitrack_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  logitrack_data:
